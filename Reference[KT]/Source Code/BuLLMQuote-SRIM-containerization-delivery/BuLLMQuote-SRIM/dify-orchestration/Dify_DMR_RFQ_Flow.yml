    - data:
        code: "\ndef main() -> dict:\n    # Deliberately errors every time this node\
          \ runs -- the iteration's error_handle_mode is 'terminated', so this stops\
          \ the whole DMR loop right here instead of letting it keep calling /tool/execute\
          \ for skills after the one that just raised hitl=1. Without this, skill_index\
          \ is never advanced past the HITL'd skill (fastapi_router.py's /tool/execute\
          \ only advances when hitl is falsy), so any later skill in this same run\
          \ would execute against un-resolved state. Once a human resolves the conflict\
          \ via the UI, GET /api/dify/start/{rfq_id} starts a fresh run that re-fetches\
          \ the routing sequence from the now-current skill_index.\n    raise Exception(\"\
          HITL pending: pipeline halted awaiting human review\")\n"
