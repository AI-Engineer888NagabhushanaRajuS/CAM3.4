# One Deployment + Service pair per Python service, all using images built by
# k8s/build-images.sh (centum/<name>:dev by default -- override via
# CENTUM_IMAGE_TAG before running that script, and update `image:` below to
# match for anything other than local dev).
#
# Probe strategy: FastAPI services (health_kind http_2xx in
# fastmcp-router/manage_backend.py) get an httpGet probe on their real
# health_path. FastMCP services (health_kind http_any -- they have no root
# route and legitimately 404 there) get a tcpSocket probe instead, since k8s's
# httpGet probe has no "any status code counts" mode and a 404 would be
# wrongly treated as unhealthy.

apiVersion: apps/v1
kind: Deployment
metadata: { name: upload-server, namespace: centum }
spec:
  replicas: 1
  selector: { matchLabels: { app: upload-server } }
  template:
    metadata: { labels: { app: upload-server } }
    spec:
      enableServiceLinks: false
      containers:
        - name: upload-server
          image: centum/upload-server:dev
          ports: [{ containerPort: 3100 }]
          envFrom: [{ configMapRef: { name: centum-config } }, { secretRef: { name: centum-secrets } }]
          volumeMounts: [{ name: database, mountPath: /app/database }]
          readinessProbe: { httpGet: { path: /docs, port: 3100 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /docs, port: 3100 }, initialDelaySeconds: 15, periodSeconds: 10 }
      volumes: [{ name: database, persistentVolumeClaim: { claimName: centum-database } }]
---
apiVersion: v1
kind: Service
metadata: { name: upload-server, namespace: centum }
spec: { selector: { app: upload-server }, ports: [{ port: 3100, targetPort: 3100 }] }
---
