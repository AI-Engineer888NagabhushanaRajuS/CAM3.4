apiVersion: apps/v1
kind: Deployment
metadata: { name: scrub-intake-mcp-server, namespace: centum }
spec:
  replicas: 1
  selector: { matchLabels: { app: scrub-intake-mcp-server } }
  template:
    metadata: { labels: { app: scrub-intake-mcp-server } }
    spec:
      enableServiceLinks: false
      containers:
        - name: scrub-intake-mcp-server
          image: centum/scrub-intake-mcp-server:dev
          ports: [{ containerPort: 8004 }]
          envFrom: [{ configMapRef: { name: centum-config } }, { secretRef: { name: centum-secrets } }]
          env:
            # host.k3d.internal, NOT host.docker.internal -- confirmed this
            # session via the actual `k3d cluster create` output ("Injecting
            # records for hostAliases (incl. host.k3d.internal)..."), k3d
            # wires this up automatically in CoreDNS for every cluster it
            # creates. This is k3d's own convention, distinct from Docker
            # Desktop's host.docker.internal.
            - { name: OLLAMA_HOST, value: "host.k3d.internal:11434" }
          volumeMounts: [{ name: database, mountPath: /app/database }]
          readinessProbe: { tcpSocket: { port: 8004 }, initialDelaySeconds: 5 }
          livenessProbe: { tcpSocket: { port: 8004 }, initialDelaySeconds: 15, periodSeconds: 10 }
      volumes: [{ name: database, persistentVolumeClaim: { claimName: centum-database } }]
---
apiVersion: v1
kind: Service
metadata: { name: scrub-intake-mcp-server, namespace: centum }
spec: { selector: { app: scrub-intake-mcp-server }, ports: [{ port: 8004, targetPort: 8004 }] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: centum-database, namespace: centum }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
  # Seed this PVC from this repo's own database/ folder once before first
  # use (kubectl cp database/ <any-pod-mounting-this-pvc>:/app/database/) --
  # the k8s manifests don't bake data into images, matching the same
  # never-mount-CAM's-live-files-into-a-container rule Phase 0 established.
