[pytest]
# The engine's own tests (mcp-tools/shared/formula_engine/engine/tests) write to /tmp: run them on Linux, e.g. in the python-bridge container.
testpaths = testing
pythonpath = testing mcp-tools/shared mcp-tools/shared/formula_engine mcp-tools/shared/formula_engine/engine
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
