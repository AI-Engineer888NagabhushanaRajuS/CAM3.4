apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: cam
  labels:
    app.kubernetes.io/part-of: cam
    app: temporal-ui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
        app.kubernetes.io/part-of: cam
    spec:
      containers:
      - name: temporal-ui
        image: temporalio/ui:2.26.0
        envFrom: []
        ports:
        - containerPort: 8080
        env:
        - name: TEMPORAL_ADDRESS
          value: temporal:7233
        - name: TEMPORAL_CORS_ORIGINS
          value: http://localhost:3000
