apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: cam
  labels:
    app.kubernetes.io/part-of: cam
    app: temporal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
        app.kubernetes.io/part-of: cam
    spec:
      containers:
      - name: temporal
        image: temporalio/auto-setup:1.24
        envFrom: []
        ports:
        - containerPort: 7233
        env:
        - name: DB
          value: postgres12
        - name: DB_PORT
          value: '5432'
        - name: POSTGRES_SEEDS
          value: postgres
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cam-logins
              key: POSTGRES_USER
        - name: POSTGRES_PWD
          valueFrom:
            secretKeyRef:
              name: cam-logins
              key: POSTGRES_PASSWORD
