apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cam
  labels:
    app.kubernetes.io/part-of: cam
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: cam
    spec:
      containers:
      - name: postgres
        image: postgres:18
        envFrom: []
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cam-logins
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cam-logins
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: cam-logins
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
