apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: cam
  labels:
    app.kubernetes.io/part-of: cam
    app: temporal-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal-worker
  template:
    metadata:
      labels:
        app: temporal-worker
        app.kubernetes.io/part-of: cam
    spec:
      containers:
      - name: temporal-worker
        image: REGISTRY/cam-temporal-worker:latest
        envFrom:
        - secretRef:
            name: cam-db-urls
        - secretRef:
            name: cam-app-keys
        - configMapRef:
            name: cam-config
        ports: []
        command:
        - sh
        - -c
        - cd /app/temporal_worker && exec python worker.py
        volumeMounts:
        - name: database
          mountPath: /app/database
        - name: exports
          mountPath: /app/exports
        - name: inbox
          mountPath: /app/fastapi-router/staged/inbox
      volumes:
      - name: database
        persistentVolumeClaim:
          claimName: cam-database
      - name: exports
        persistentVolumeClaim:
          claimName: cam-exports
      - name: inbox
        persistentVolumeClaim:
          claimName: cam-inbox
